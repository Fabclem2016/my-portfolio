<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Ogbole's Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <a class="logo" href="index.html"><span class="logo-mark" data-text="brand.mark"></span><span><span data-text="brand.first"></span><b data-text="brand.second"></b></span></a>
      <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
      <ul id="navLinks"></ul>
      <a class="cta" id="ctaLink" href="contact.html"></a>
    </nav>
  </header>
  <main>
    <div class="page-head">
      <p class="eyebrow">Say hello</p>
      <h1>Contact <span class="accent">me.</span></h1>
      <p class="lead">Send me a message and I will get back to you.</p>
    </div>
    <section>
      <form id="contactForm" novalidate>
        <label for="name">Name</label>
        <input type="text" id="name" name="name"><p class="error" id="nameError"></p>
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email"><p class="error" id="emailError"></p>
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone"><p class="error" id="phoneError"></p>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5"></textarea><p class="error" id="messageError"></p>
        <button class="btn" type="submit">Send Message</button>
        <p id="formStatus" role="status"></p>
      </form>
    </section>
  </main>
  <footer><p id="footerText"></p></footer>
  <script src="js/data.js"></script>
  <script src="js/render.js"></script>
  <script src="js/contact.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
