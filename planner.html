<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Planner | Ogbole's Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <a class="logo" href="index.html"><span class="logo-mark" data-text="brand.mark"></span><span><span data-text="brand.first"></span><b data-text="brand.second"></b></span></a>
      <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
      <ul id="navLinks"></ul>
      <a class="cta" id="ctaLink" href="contact.html"></a>
    </nav>
  </header>
  <main>
    <div class="page-head">
      <p class="eyebrow">Stay organised</p>
      <h1>Academic <span class="accent">planner.</span></h1>
      <p class="lead">Add tasks, tick them off and keep your coursework on track.</p>
    </div>
    <section>
      <div class="planner-box">
        <form class="task-form" id="taskForm">
          <input type="text" id="taskInput" placeholder="Add a task, e.g. Submit COS 106 project" aria-label="New task">
          <button class="btn" type="submit">Add</button>
        </form>
        <p class="error" id="taskError"></p>
        <ul id="taskList"></ul>
        <p id="taskCount"></p>
      </div>
    </section>
  </main>
  <footer><p id="footerText"></p></footer>
  <script src="js/data.js"></script>
  <script src="js/render.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
